services:
  ollama:
    image: ollama/ollama:latest
    container_name: harness-ollama
    ports:
      - "11431:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - harness-net
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: harness-ollama-pull
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - harness-net
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    # Скачивает модель, только если qwen3.5:4b еще нет в списке
    command: >
      -c "
      if ollama list | grep -q 'qwen3.5:4b'; then
        echo 'Модель уже загружена, пропускаем.';
      else
        echo 'Запуск загрузки модели...';
        ollama pull qwen3.5:4b;
      fi
      "

networks:
  harness-net:
    name: harness-net

volumes:
  ollama-data:
