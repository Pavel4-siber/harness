spring.application.name=harness

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11431}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen3.5:4b}
spring.ai.ollama.chat.options.num-predict=${OLLAMA_NUM_PREDICT:512}
spring.ai.ollama.chat.options.temperature=0.2
app.chat.max-history-turns=${CHAT_MAX_HISTORY_TURNS:20}
app.chat.max-conversations=${CHAT_MAX_CONVERSATIONS:1000}
app.chat.conversation-ttl-minutes=${CHAT_CONVERSATION_TTL_MINUTES:60}
app.chat.system-prompt=${CHAT_SYSTEM_PROMPT:You are a helpful assistant. Reply in the language of the user's message.\
  Be concise and to the point. Skip long introductions and explanations unless asked.}
app.chat.timezone=${CHAT_TIMEZONE:Europe/Moscow}