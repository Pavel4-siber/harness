spring.application.name=harness

# Ollama endpoint can be overridden with OLLAMA_BASE_URL.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11431}
spring.ai.ollama.chat.model=qwen3.5:4b
spring.ai.ollama.chat.options.num-predict=${OLLAMA_NUM_PREDICT:128}
spring.ai.ollama.chat.options.think=false
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.timeout=${OLLAMA_TIMEOUT:10m}

# Maximum number of user/assistant turns retained for each conversation.
app.chat.max-history-turns=${CHAT_MAX_HISTORY_TURNS:20}
