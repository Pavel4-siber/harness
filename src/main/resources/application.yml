spring:
  application:
    name: harness
  ai:
    ollama:
      base-url: http://localhost:11431
  mvc:
    async:
      request-timeout: 15m

app:
  chat:
    max-history-turns: 20
    max-conversations: 1000
    conversation-ttl: PT60M
    timezone: Europe/Moscow
    default-model: qwen3.5:4b
    default-num-predict: 512
    default-temperature: 0.2
    default-system-prompt: "You are a helpful assistant."
